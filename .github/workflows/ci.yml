# CI Pipeline for Intelli-PEST Backend
# =====================================
# Runs on every push and pull request to main/develop branches
#
# Stages:
#   1. Lint (ruff) - Fast code quality check
#   2. Type Check (pyright) - Static type analysis
#   3. Test (pytest) - Unit and integration tests
#
# Note: Uses CPU-only PyTorch to keep CI fast and avoid GPU costs

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs for same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  CUDA_VISIBLE_DEVICES: "" # Force CPU-only

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check . --output-format=github
        continue-on-error: true # Warning only for now, enforce later

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install pyright
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r inference_server/requirements.txt || true

      - name: Run pyright
        run: pyright --warnings
        continue-on-error: true # Warning only for now
        env:
          PYTHONPATH: "."

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [lint] # Run after lint, but don't require it to pass
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov pytest-timeout
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r inference_server/requirements.txt || true
          pip install -r knowledge_distillation/requirements.txt || true

      - name: Verify test collection
        run: |
          python -m pytest tests/ black_ops_training/tests/ --collect-only -q
        env:
          PYTHONPATH: "."

      - name: Run tests
        run: |
          python -m pytest tests/ black_ops_training/tests/ \
            --cov=inference_server \
            --cov=black_ops_training \
            --cov-report=term-missing \
            --cov-report=xml \
            --timeout=120 \
            -v
        env:
          CUDA_VISIBLE_DEVICES: ""
          CI: "true"
          PYTHONPATH: "."

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            .coverage
            coverage.xml
          retention-days: 7
          if-no-files-found: ignore

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify imports
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r inference_server/requirements.txt
          python -c "from inference_server.fastapi_app import app; print('✅ FastAPI app imports successfully')"
          python -c "from black_ops_training.ghost_trainer import GhostTrainer; print('✅ GhostTrainer imports successfully')" || true
