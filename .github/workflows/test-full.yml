# ============================================================
# Full Test Suite Workflow
# ============================================================
# Runs comprehensive tests on multiple Python versions.
# Triggered nightly and on manual dispatch.
#
# This workflow provides:
# - Multi-Python version testing (3.10, 3.11, 3.12)
# - Coverage report
# - Test timing analysis
# ============================================================

name: Full Test Suite

on:
  schedule:
    # Run nightly at 2:00 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      python_versions:
        description: "Python versions to test (comma-separated)"
        required: false
        default: "3.10,3.11,3.12"

env:
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1

jobs:
  test-matrix:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-timeout pytest-xdist
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r inference_server/requirements.txt
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: 1

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            -v \
            --timeout=120 \
            --cov=inference_server \
            --cov=src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --junitxml=test-results-${{ matrix.python-version }}.xml
        env:
          PYTHONPATH: ${{ github.workspace }}
          CI: true
          CUDA_VISIBLE_DEVICES: ""

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: coverage.xml
          flags: unittests
          name: codecov-py${{ matrix.python-version }}
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            test-results-*.xml
            htmlcov/
          retention-days: 14

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          merge-multiple: true

      - name: Test Summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for version in 3.10 3.11 3.12; do
            if [ -f "test-results-${version}.xml" ]; then
              echo "### Python ${version}" >> $GITHUB_STEP_SUMMARY
              tests=$(grep -oP 'tests="\K[0-9]+' test-results-${version}.xml | head -1)
              failures=$(grep -oP 'failures="\K[0-9]+' test-results-${version}.xml | head -1)
              errors=$(grep -oP 'errors="\K[0-9]+' test-results-${version}.xml | head -1)
              skipped=$(grep -oP 'skipped="\K[0-9]+' test-results-${version}.xml | head -1)
              
              echo "- Tests: ${tests:-0}" >> $GITHUB_STEP_SUMMARY
              echo "- Failures: ${failures:-0}" >> $GITHUB_STEP_SUMMARY
              echo "- Errors: ${errors:-0}" >> $GITHUB_STEP_SUMMARY
              echo "- Skipped: ${skipped:-0}" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done
