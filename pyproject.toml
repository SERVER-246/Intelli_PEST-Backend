# Intelli-PEST Backend - Project Configuration
# =============================================
# Unified configuration for development tools

[project]
name = "intelli-pest-backend"
version = "1.0.0"
description = "Sugarcane pest detection inference server and training pipeline"
requires-python = ">=3.10"
license = {text = "MIT"}

# ============================================================
# Ruff Configuration (Linting & Formatting)
# ============================================================
[tool.ruff]
line-length = 120
target-version = "py310"

# Exclude directories from linting
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    "*.egg-info",
    "build",
    "dist",
    "model_backups",
    "teacher_models",
    "tflite_models_compatible",
    "Apk-versions",
    "feedback_images",
    "test_images",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (we set line-length above)
    "E402",  # module level import not at top (common in ML code)
    "E701",  # multiple statements on one line (colon)
    "E702",  # multiple statements on one line (semicolon)
    "E722",  # bare except (legacy code, too many to fix)
    "E741",  # ambiguous variable name (l, I, O)
    "B008",  # function call in default argument
    "B904",  # raise without from inside except (legacy code)
    "B905",  # zip without explicit strict
    "B007",  # unused loop variable
    "F401",  # imported but unused (handled separately)
    "F841",  # local variable assigned but never used
    "UP035", # deprecated typing imports (Dict, List, etc.) - need Python 3.9 compat
]

[tool.ruff.lint.per-file-ignores]
# Relaxed rules for test files
"tests/*" = ["B", "C4", "F401", "F841"]
"test_*.py" = ["B", "C4", "F401", "F841"]
# Relaxed rules for legacy training code
"black_ops_training/*" = ["E", "W", "B", "C4"]
# Relaxed for scripts
"scripts/*" = ["E", "W"]

[tool.ruff.lint.isort]
known-first-party = ["inference_server", "black_ops_training", "src"]

# ============================================================
# Pytest Configuration
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"

# Default options
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]

# Filter warnings
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::FutureWarning",
]

# Custom markers
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU (skipped in CI)",
    "integration: marks integration tests",
]

# Timeout per test (seconds)
timeout = 120

# ============================================================
# Coverage Configuration
# ============================================================
[tool.coverage.run]
source = ["inference_server", "black_ops_training"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/test_*.py",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "\\.\\.\\.",
]
show_missing = true
precision = 2

# ============================================================
# Pyright Configuration (extends pyrightconfig.json)
# ============================================================
[tool.pyright]
include = ["inference_server", "black_ops_training", "src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportOptionalSubscript = "warning"
reportOptionalMemberAccess = "warning"
